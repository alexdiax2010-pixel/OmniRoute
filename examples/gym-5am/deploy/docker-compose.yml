# Opción servidor propio (VPS): la app + Caddy, que obtiene y renueva el certificado HTTPS solo.
# Uso: define DOMINIO, ADMIN_CODE y ADMIN_PASSWORD en deploy/.env y ejecuta `docker compose up -d --build`.
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      ADMIN_CODE: ${ADMIN_CODE:?Define ADMIN_CODE en deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en deploy/.env}
    volumes:
      - gym_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gym_data:
  caddy_data:
  caddy_config:
