<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administración — Wellness Fitness 5AM</title>
    <meta name="theme-color" content="#0c0d0b" />
    <meta name="robots" content="noindex" />
    <link
      rel="preload"
      href="fonts/Switzer-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- ============ LOGIN ============ -->
    <main class="login" hidden data-view="login">
      <div class="login__photo" aria-hidden="true"><div class="grain"></div></div>
      <form class="login__card" data-login>
        <div class="brand">
          <span class="brand__5am">5AM<b>.</b></span>
          <span class="brand__sub">Wellness<br />Fitness</span>
        </div>
        <h1 class="login__title">Panel <span class="outline">de</span> control</h1>
        <div class="field">
          <label for="pin">PIN de administración</label>
          <input
            id="pin"
            name="pin"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            required
          />
        </div>
        <p class="login__error" role="alert" data-login-error></p>
        <button class="btn btn--lime btn--block" type="submit">
          Entrar <span aria-hidden="true">↗</span>
        </button>
        <a class="login__back" href="/">← Volver a la pantalla de entrada</a>
      </form>
    </main>

    <!-- ============ APP ============ -->
    <div class="app" hidden data-view="app">
      <aside class="side">
        <div class="side__brand">
          <div class="brand">
            <span class="brand__5am">5AM<b>.</b></span>
            <span class="brand__sub">Wellness<br />Fitness</span>
          </div>
        </div>
        <nav class="side__nav" aria-label="Secciones">
          <button type="button" data-tab="resumen" class="is-active">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z" />
            </svg>
            Resumen
          </button>
          <button type="button" data-tab="socios">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
              />
            </svg>
            Socios
          </button>
          <button type="button" data-tab="cobros">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 6h20v12H2zM2 10h20M6 15h4" />
            </svg>
            Cobros
          </button>
          <button type="button" data-tab="tienda">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 7h12l-1 13H7L6 7Z" />
              <path d="M9 7a3 3 0 0 1 6 0" />
            </svg>
            Tienda
          </button>
          <button type="button" data-tab="promociones">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1ZM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"
              />
            </svg>
            Promociones
          </button>
          <button type="button" data-tab="instructores">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0" />
              <path d="m16 3 2 2 3-3" />
            </svg>
            Instructores
          </button>
          <button type="button" data-tab="avisos">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" />
            </svg>
            Avisos <span class="side__badge" hidden data-reminders-badge></span>
          </button>
          <button type="button" data-tab="entradas">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
            </svg>
            Entradas
          </button>
          <button type="button" data-tab="ajustes">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              />
            </svg>
            Ajustes
          </button>
        </nav>
        <div class="side__foot">
          <a class="btn btn--sm btn--block" href="/" target="_blank" rel="noopener"
            >Abrir pantalla de entrada ↗</a
          >
          <button type="button" class="btn btn--sm btn--block" data-logout>Cerrar sesión</button>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="main__head">
          <div>
            <p class="main__kicker" data-today></p>
            <h1 class="main__title" data-title>Resumen</h1>
          </div>
          <div class="main__actions">
            <button type="button" class="btn btn--lime" data-action="new-member">
              + Nuevo socio
            </button>
          </div>
        </header>
        <section class="view" data-panel></section>
      </main>
    </div>

    <!-- ============ MODAL ============ -->
    <dialog class="modal" data-modal>
      <div class="modal__box">
        <button type="button" class="modal__close" aria-label="Cerrar" data-close>×</button>
        <div data-modal-body></div>
      </div>
    </dialog>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="js/admin.js" defer></script>
  </body>
</html>
