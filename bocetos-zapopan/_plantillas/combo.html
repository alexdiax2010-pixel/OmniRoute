<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{fontUrl}}">
<style>
  :root{--c1:{{oscuro}};--c2:{{medio}};--acc:{{acento}};--on:{{sobreOscuro}};--bar:{{barraColor}};--bar-ink:{{barraTinta}}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{position:relative;background:radial-gradient(140% 120% at 85% 100%,var(--c2) 0%,var(--c1) 58%);font-family:{{fuenteTexto}};color:var(--on)}
  .glow{position:absolute;width:1200px;height:600px;border-radius:50%;background:var(--acc);opacity:.2;filter:blur(170px);left:55%;top:68%;transform:translate(-50%,-50%)}
  header{position:absolute;top:58px;left:0;right:0;text-align:center}
  .eyebrow{display:inline-flex;align-items:center;gap:14px;font:700 22px/1 {{fuenteTexto}};letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
  .eyebrow::before,.eyebrow::after{content:"";width:46px;height:2px;background:currentColor;opacity:.7}
  h1{margin-top:18px;font-family:{{fuenteTitulo}};font-weight:{{pesoTitulo}};font-size:{{tamTitulo}};line-height:1.02;letter-spacing:{{trackTitulo}};text-transform:{{mayusTitulo}}}
  .sub{margin-top:14px;font-size:22px;opacity:.78}
  /* Laptop */
  .laptop{position:absolute;left:190px;top:300px;width:1220px}
  .lid{width:1120px;margin:0 auto;background:#111215;border-radius:26px 26px 0 0;padding:22px 22px 26px;box-shadow:inset 0 0 0 2px #2c2d33,0 40px 80px rgba(0,0,0,.45)}
  .lid .cam{width:8px;height:8px;border-radius:50%;background:#2e3036;margin:-12px auto 6px}
  .lid img{display:block;width:100%;height:616px;object-fit:cover;object-position:top;border-radius:4px}
  .base{position:relative;height:30px;background:linear-gradient(#d9dbe0,#a9adb5);border-radius:0 0 22px 22px;box-shadow:0 30px 50px rgba(0,0,0,.45)}
  .base::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:200px;height:12px;background:#b9bcc3;border-radius:0 0 12px 12px}
  /* Phone */
  .phone{position:absolute;left:1360px;top:376px;width:310px;height:679px;border-radius:50px;background:#0c0c0f;padding:11px;
    box-shadow:inset 0 0 0 2px #34343a,0 0 0 4px #1b1b1f,0 0 0 5px #3a3a40,0 50px 90px rgba(0,0,0,.55)}
  .screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--bar)}
  .status{height:34px;background:var(--bar);color:var(--bar-ink);font:600 12px/34px -apple-system,system-ui,sans-serif;padding-left:30px}
  .island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:86px;height:24px;border-radius:12px;background:#000}
  .screen img{display:block;width:100%;height:calc(100% - 34px);object-fit:cover;object-position:top}
  .dom{position:absolute;bottom:28px;left:40px;font-size:15px;letter-spacing:.06em;opacity:.65}
</style>
</head>
<body>
  <div class="glow"></div>
  <header>
    <div class="eyebrow">Propuesta de página web</div>
    <h1>{{nombre}}</h1>
    <p class="sub">{{giroLinea}}</p>
  </header>
  <div class="laptop">
    <div class="lid"><div class="cam"></div><img src="{{capturaEscritorio}}" alt=""></div>
    <div class="base"></div>
  </div>
  <div class="phone"><div class="screen"><div class="status">9:41</div><img src="{{capturaMovil}}" alt=""><div class="island"></div></div></div>
  <div class="dom">{{dominio}} · Diseño de propuesta, datos sujetos a confirmación</div>
</body>
</html>
