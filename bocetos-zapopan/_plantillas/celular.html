<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{fontUrl}}">
<style>
  :root{--c1:{{oscuro}};--c2:{{medio}};--acc:{{acento}};--on:{{sobreOscuro}};--bar:{{barraColor}};--bar-ink:{{barraTinta}}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{position:relative;background:linear-gradient(160deg,var(--c2) 0%,var(--c1) 62%);font-family:{{fuenteTexto}};color:var(--on);display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;width:820px;height:820px;border-radius:50%;background:var(--acc);opacity:.22;filter:blur(130px);left:50%;top:52%;transform:translate(-50%,-50%)}
  .rings{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 420px,rgba(255,255,255,.05) 421px 423px,transparent 424px 560px,rgba(255,255,255,.04) 561px 563px,transparent 564px)}
  .phone{position:relative;width:540px;height:1185px;border-radius:84px;margin-top:-30px;background:#0c0c0f;padding:17px;
    box-shadow:inset 0 0 0 2px #34343a,0 0 0 5px #1b1b1f,0 0 0 7px #3a3a40,0 70px 120px rgba(0,0,0,.55),0 24px 40px rgba(0,0,0,.35)}
  .btn{position:absolute;width:6px;border-radius:3px;background:#2b2b30}
  .b1{left:-12px;top:230px;height:70px}.b2{left:-12px;top:330px;height:110px}.b3{left:-12px;top:460px;height:110px}.b4{right:-12px;top:340px;height:160px}
  .screen{position:relative;width:100%;height:100%;border-radius:68px;overflow:hidden;background:var(--bar)}
  .status{height:56px;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;justify-content:space-between;padding:6px 44px 0 52px;font:600 19px/1 -apple-system,"Segoe UI",system-ui,sans-serif}
  .status .ic{display:flex;gap:7px;align-items:center}
  .status svg{height:16px;fill:currentColor}
  .island{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:150px;height:42px;border-radius:22px;background:#000}
  .shot{display:block;width:100%;height:calc(100% - 56px);object-fit:cover;object-position:top}
  .home{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:180px;height:6px;border-radius:3px;background:rgba(0,0,0,.35)}
  .label{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font:600 17px/1 {{fuenteTexto}};letter-spacing:.14em;text-transform:uppercase;opacity:.75;white-space:nowrap}
</style>
</head>
<body>
  <div class="glow"></div><div class="rings"></div>
  <div class="phone">
    <span class="btn b1"></span><span class="btn b2"></span><span class="btn b3"></span><span class="btn b4"></span>
    <div class="screen">
      <div class="status"><span>9:41</span><span class="ic">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg>
      </span></div>
      <img class="shot" src="{{capturaMovil}}" alt="">
      <div class="island"></div>
      <div class="home"></div>
    </div>
  </div>
  <div class="label">Propuesta de diseño · {{nombre}}</div>
</body>
</html>
