<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{fontUrl}}">
<style>
  :root{--c1:{{oscuro}};--c2:{{medio}};--acc:{{acento}};--on:{{sobreOscuro}}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{position:relative;background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);font-family:{{fuenteTexto}};color:var(--on);display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;width:1300px;height:700px;border-radius:50%;background:var(--acc);opacity:.18;filter:blur(160px);left:50%;top:55%;transform:translate(-50%,-50%)}
  .win{position:relative;width:1400px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 60px 120px rgba(0,0,0,.5),0 18px 36px rgba(0,0,0,.3);margin-top:-14px}
  .bar{height:56px;background:#eceef1;border-bottom:1px solid #d6d9de;display:flex;align-items:center;gap:22px;padding:0 20px;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
  .dots{display:flex;gap:9px}.dots i{width:14px;height:14px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .nav{display:flex;gap:14px;color:#8a8f98}.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
  .url{flex:1;max-width:760px;margin:0 auto;height:36px;border-radius:18px;background:#fff;border:1px solid #d6d9de;display:flex;align-items:center;justify-content:center;gap:9px;color:#2b2f36;font-size:17px;letter-spacing:.01em}
  .url svg{width:14px;height:14px;fill:#5f6670}
  .spacer{width:110px}
  .shot{display:block;width:1400px;height:875px;object-fit:cover;object-position:top}
  .label{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:600 16px/1 {{fuenteTexto}};letter-spacing:.16em;text-transform:uppercase;opacity:.75;white-space:nowrap}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="win">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="nav"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></span>
      <span class="url"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1Zm2 0h6V7a3 3 0 0 0-6 0Z"/></svg>{{dominio}}</span>
      <span class="spacer"></span>
    </div>
    <img class="shot" src="{{capturaEscritorio}}" alt="">
  </div>
  <div class="label">Propuesta de diseño · {{nombre}}</div>
</body>
</html>
